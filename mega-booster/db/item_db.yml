# Mega Booster: item scripts for event items stock rAthena leaves
# unscripted or scripts differently from the kRO client. Only Id and
# the changed fields; everything else stays as stock rAthena has it.
# Contents are from the kRO client item descriptions (itemInfo_true.lub)
# unless a comment says otherwise.

Header:
  Type: ITEM_DB
  Version: 3

Body:
  # Booster Call: summons Lime Evenor (npc/booster_lime.txt) next to the
  # player. kRO keeps the Call after use, so it isn't consumed.
  - Id: 100337
    Flags:
      NoConsume: true
    Script: |
      duplicate_dynamic("Lime Evenor#booster");
  # Premium Booster Call: the same NPC, which shows the premium menus
  # while the player holds this item.
  - Id: 101473
    Flags:
      NoConsume: true
    Script: |
      duplicate_dynamic("Lime Evenor#booster");
  # Premium Booster Box: stock gives 1 reset ticket of each kind; the
  # client says 15 (and GN's upgrade maths, 5 + 10, agrees).
  - Id: 103048
    Script: |
      getitem 101473,1;
      getitem 100029,1;
      getitem 101458,1;
      getitem 101459,1;
      getitem 1000967,15;
      getitem 1000983,15;
      getitem 101589,1;
      getitem 1000995,1;
  # Booster Pack (1): kRO's pack gives every class a Metal Dagger, which
  # Doram and the Druid line can't equip. They get a weapon of the same
  # Metal series (Metal Weapon Box) instead: Doram the Metal Foxtail, the
  # Druid line the Metal Mace. This is a mod change, not kRO's.
  # [unverified: what kRO Doram and Druids get here]
  - Id: 100029
    Script: |
      getgroupitem(IG_BOOSTER_PACK_1,true);
      .@base = eaclass() & EAJ_BASEMASK;
      if (countitem(13079) > 0) {
         if (.@base == EAJ_SUMMONER) {
            delitem 13079,1;
            getitem 26111,1;
         } else if (.@base == EAJ_DRUID) {
            delitem 13079,1;
            getitem 16023,1;
         }
      }
  # Karnos Booster weapons (the server knows them from its regional item
  # table since app 1.6.4). Full scripts from the kRO client text, in the
  # pattern of the stock booster weapons; the regional table leaves out
  # the Base Lv and Lv 7 lines. [unverified: kRO client text only]
  # Gust Hail Booster Dagger: Lv 7 gives 1% ranged damage per level of
  # Raptorial Instinct.
  - Id: 510200
    Script: |
      .@r = getrefine();
      bonus bUnbreakableWeapon;
      bonus bAtkRate,2;
      bonus bBaseAtk,3*.@r+3*(min(BaseLevel,195)/15);
      if (.@r >= 7) {
         bonus bLongAtkRate,getskilllv("KR_RAPTORIAL_INSTINCT");
      }
      if (.@r >= 9) {
         bonus bAspd,1;
         bonus2 bSkillAtk,"KR_SHARPEN_GUST",25;
         bonus2 bSkillAtk,"KR_SHARPEN_HAIL",25;
      }
      if (.@r >= 11) {
         bonus2 bAddSize,Size_All,15;
         bonus bLongAtkRate,15;
      }
      if (.@r >= 13) {
         bonus2 bSkillAtk,"KR_SHARPEN_GUST",15;
         bonus2 bSkillAtk,"KR_SHARPEN_HAIL",15;
      }
  # Slash Chop-Chop Booster Axe: Lv 7 gives 1% melee damage per level
  # of Wolf Instinct.
  - Id: 620064
    Script: |
      .@r = getrefine();
      bonus bUnbreakableWeapon;
      bonus bAtkRate,2;
      bonus bBaseAtk,3*.@r+3*(min(BaseLevel,195)/15);
      if (.@r >= 7) {
         bonus bShortAtkRate,getskilllv("KR_WOLF_INSTINCT");
      }
      if (.@r >= 9) {
         bonus bDelayrate,-5;
         bonus2 bSkillAtk,"KR_DOUBLE_SLASH",25;
         bonus2 bSkillAtk,"KR_CHOP_CHOP",25;
      }
      if (.@r >= 11) {
         bonus bDelayrate,-10;
         bonus2 bAddSize,Size_All,20;
      }
      if (.@r >= 13) {
         bonus2 bSkillAtk,"KR_DOUBLE_SLASH",15;
         bonus2 bSkillAtk,"KR_CHOP_CHOP",15;
      }
  # Booster Costume Headgear Box: pick 1 of 4 (the four hoods that
  # item_enchant.yml Id 37 enchants).
  - Id: 101458
    Script: |
      callfunc "F_Booster_Pick",101458,440003,1,440006,1,440007,1,440009,1;
  # Booster Costume Garment Box: pick 1 of 4 school bags (Id 38).
  - Id: 101459
    Script: |
      callfunc "F_Booster_Pick",101459,20595,1,20575,1,20615,1,20616,1;
  # Booster Armor Box: one of four sets, as the set's crate.
  - Id: 101423
    Script: |
      callfunc "F_Booster_Pick",101423,100046,1,100047,1,100048,1,100049,1;
  # Souvenir Box: pick a Booster Mask (GN coin shop + client).
  - Id: 101456
    Script: |
      callfunc "F_Booster_Pick",101456,410018,1,410019,1,410020,1;
  # Premium Souvenir Box: pick a Booster Scarf.
  - Id: 101457
    Script: |
      callfunc "F_Booster_Pick",101457,420153,1,420154,1,420155,1;
  # Special Currency Pouch (Lv 200): 3 Cor Core + 18 Mysterious
  # Components, 20 Barmil Tickets, 20 Amethyst Fragments or 20 Snow
  # Flower Petals. [unverified: that Ep19_Snow_Flower is 설화의 꽃잎]
  - Id: 101453
    Script: |
      mes "[Special Currency Pouch]";
      mes "Choose one.";
      .@s = select("3 Cor Core + 18 Mysterious Components", "20 Barmil Tickets", "20 Amethyst Fragments", "20 Snow Flower Petals", "Cancel");
      if (.@s == 5 || countitem(101453) < 1) close;
      delitem 101453,1;
      switch (.@s) {
      case 1: getitem 25723,3; getitem 25669,18; break;
      case 2: getitem 1000103,20; break;
      case 3: getitem 1000405,20; break;
      case 4: getitem 1000608,20; break;
      }
      close;
  # Metal Weapon Box: one +7 Metal weapon [1]. The client names the
  # weapons, not their IDs; these are rAthena's 1-slot Metal weapons.
  # [unverified: item IDs]
  - Id: 101454
    Script: |
      setarray .@w[0], 21005, 1493, 16023, 1398, 13079, 1588, 2018, 1296, 18116, 13125, 26111;
      for (.@i = 0; .@i < getarraysize(.@w); .@i++) .@menu$ += "+7 " + getitemname(.@w[.@i]) + ":";
      mes "[Metal Weapon Box]";
      mes "Choose one.";
      .@s = select(.@menu$ + "Cancel") - 1;
      if (.@s >= getarraysize(.@w) || countitem(101454) < 1) close;
      delitem 101454,1;
      getitem2 .@w[.@s],1,1,7,0,0,0,0,0;
      close;
